name: daily-checkin

# Disabled: no events trigger this workflow.
on: []

jobs:
  checkin:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Wait until random check-in time
        if: github.event_name == 'schedule'
        run: |
          wait_seconds="$(python3 - <<'PY'
          from datetime import datetime, timedelta
          from random import randint
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Shanghai")
          now = datetime.now(tz)
          target = now.replace(hour=9, minute=0, second=0, microsecond=0) + timedelta(seconds=randint(0, 600))
          wait_seconds = max(0, int((target - now).total_seconds()))

          print(wait_seconds)
          print(f"Random check-in target: {target.isoformat()}", file=__import__("sys").stderr)
          PY
          )"
          echo "Waiting ${wait_seconds}s before check-in."
          sleep "${wait_seconds}"

      - name: Run auto check-in
        env:
          AUTO_CHECKIN_SECRET_VALUES_JSON: ${{ toJson(secrets) }}
        run: |
          set -o pipefail
          pnpm checkin 2>&1 | tee checkin.log || true

      - name: Notify Telegram summary
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          status_icon="✅"
          status_text="success"

          if [ -f checkin.log ]; then
            summary="$(python3 -c "from pathlib import Path; text = Path('checkin.log').read_text(encoding='utf-8', errors='replace').splitlines(); selected = [line for line in text if line.startswith('Processed ') or line.startswith('success=') or line.startswith('[')]; print('\\n'.join(selected[-20:]) if selected else 'No check-in summary captured.')")"
          else
            summary="No check-in log found."
          fi

          if printf '%s\n' "${summary}" | grep -Eq '^success=.* failed=[1-9][0-9]*'; then
            status_icon="❌"
            status_text="failed"
          fi

          message="${status_icon} auto-check-in ${status_text}\nRepo: ${REPO}\nBranch: ${REF_NAME}\nRun: #${RUN_NUMBER}\nhttps://github.com/${REPO}/actions/runs/${RUN_ID}\n\n${summary}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}"
